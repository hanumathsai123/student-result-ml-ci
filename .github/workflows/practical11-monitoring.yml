name: Practical 11 - Application Logging and Error Tracking

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api.py"
      - "Dockerfile"
      - "requirements.txt"
      - "train_model.py"
      - "quality_gate.py"
      - ".github/workflows/practical11-monitoring.yml"

permissions:
  contents: read

jobs:
  logging-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train model
        run: python train_model.py

      - name: Check model quality
        run: python quality_gate.py

      - name: Build test image
        run: docker build -t student-result-practical11 .

      - name: Start container
        run: docker run -d --name practical11-monitor -p 5000:5000 student-result-practical11

      - name: Verify health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Health endpoint is responding."
              exit 0
            fi
            sleep 2
          done
          docker logs practical11-monitor
          exit 1

      - name: Verify successful prediction and validation error
        run: |
          curl --fail --silent --show-error -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":95,"internal_marks":95,"assignment_marks":95,"previous_score":95}'
          status=$(curl --silent --output /tmp/validation-response.json --write-out "%{http_code}" \
            -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":150,"internal_marks":95,"assignment_marks":95,"previous_score":95}')
          cat /tmp/validation-response.json
          test "$status" = "422"

      - name: Capture request and error logs
        if: always()
        run: docker logs practical11-monitor || true

      - name: Clean up container
        if: always()
        run: docker rm -f practical11-monitor || true
